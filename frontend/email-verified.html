<!DOCTYPE html>
<html class="dark" lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body {
      background-color: #0b1326;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(111, 0, 190, 0.05) 0px, transparent 50%);
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(62, 72, 79, 0.3);
    }
    .neon-glow {
      box-shadow: 0 0 20px rgba(142, 213, 255, 0.15);
    }
  </style>

        extend: {

            "on-secondary-fixed-variant": "#6900b3", "on-surface": "#dae2fd", "background": "#0b1326",

            "error-container": "#93000a", "on-secondary": "#490080", "on-tertiary-fixed": "#2a1700",
            "on-primary-fixed": "#001e2c", "surface-container-lowest": "#060e20", "surface-dim": "#0b1326",
            "surface-bright": "#31394d", "error": "#ffb4ab", "on-secondary-container": "#d6a9ff",
            "inverse-on-surface": "#283044", "on-tertiary-fixed-variant": "#653e00", "tertiary-fixed-dim": "#ffb960",
            "primary": "#8ed5ff", "outline-variant": "#3e484f", "surface-container-highest": "#2d3449",
            "on-background": "#dae2fd", "on-primary-fixed-variant": "#004c69", "primary-container": "#38bdf8",
            "on-surface-variant": "#bdc8d1", "on-tertiary": "#472a00", "on-tertiary-container": "#613b00"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          "spacing": { "unit": "4px", "container-max": "1440px", "stack-sm": "8px", "stack-lg": "32px", "margin-page": "40px", "sidebar-width": "280px", "stack-md": "16px", "gutter": "24px" },
          "fontFamily": { "code-sm": ["JetBrains Mono"], "body-base": ["Inter"], "label-caps": ["Inter"], "headline-md": ["Inter"], "display-lg": ["Inter"] },
          "fontSize": {
            "code-sm": ["14px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
            "body-base": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
            "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        }

  </script>
  <script type="module" src="./src/theme.js"></script>
</head>
<body class="font-body-base text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-page">
  <div class="mb-stack-lg">
    <div class="flex items-center gap-stack-sm">
      <span class="material-symbols-outlined text-primary text-[32px]">terminal</span>
      <h1 class="font-display-lg text-headline-md text-primary tracking-tighter">DebugAI</h1>
    </div>
  </div>

  <main class="w-full max-w-[480px] glass-card rounded-xl p-stack-lg flex flex-col items-center text-center relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[60px] rounded-full"></div>
    
    <div class="mb-stack-lg relative">
      <div class="w-24 h-24 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center neon-glow">
        <span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
      </div>
      <div class="absolute -top-2 -left-2 w-2 h-2 rounded-full bg-secondary"></div>
      <div class="absolute top-10 -right-4 w-1.5 h-1.5 rounded-full bg-primary"></div>
    </div>

    <header class="mb-stack-lg space-y-stack-sm">
      <h2 class="font-display-lg text-headline-md text-on-surface">Email Verified</h2>
      <p class="font-body-base text-on-surface-variant max-w-[320px] mx-auto">
        Your developer identity has been confirmed. You now have full access to the DebugAI diagnostic terminal.
      </p>
    </header>

    <div class="w-full grid grid-cols-1 gap-stack-sm mb-stack-lg">
      <div class="flex items-center justify-between p-stack-md bg-surface-container-lowest/50 rounded-lg border border-outline-variant/10">
        <div class="flex flex-col items-start">
          <span class="font-label-caps text-on-tertiary-fixed-variant uppercase">Account Status</span>
          <span class="font-code-sm text-primary">active_v2.4.0</span>
        </div>
        <div class="flex flex-col items-end">
          <span class="font-label-caps text-on-tertiary-fixed-variant uppercase">Auth Method</span>
          <span class="font-code-sm text-on-surface-variant" id="auth-method">secure_jwt</span>
        </div>
      </div>
    </div>

    <div class="w-full space-y-stack-md">
      <a href="/" class="w-full py-stack-md bg-primary-container text-on-primary-fixed font-bold rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-stack-sm">
        Continue to Dashboard
        <span class="material-symbols-outlined">arrow_forward</span>
      </a>
      <p class="font-label-caps text-outline">
        Redirecting in <span class="text-primary font-code-sm" id="countdown">5s</span>
      </p>
    </div>
  </main>

  <footer class="mt-stack-lg flex flex-col items-center gap-stack-sm opacity-40">
    <div class="flex gap-stack-md">
      <span class="font-code-sm text-outline">LATENCY: 14ms</span>
      <span class="font-code-sm text-outline">NODE: US-EAST-1</span>
    </div>
    <div class="w-32 h-[1px] bg-gradient-to-r from-transparent via-outline-variant to-transparent"></div>
  </footer>

  <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
    <div class="absolute top-[10%] left-[5%] opacity-20 rotate-12">
      <img alt="Tech Element" class="w-32 h-32 blur-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBnlG7uPjwvSf2qYebZyg7g9qokJlfvhPMzg88pYdoNbTsj3rW-s4YcEKkJ4dhZqvNRBC8gF0E-TA7qwsEUuuSbm-JG4ywhU2B7mAYwbRxBA_ZBsF6bFIkJKwz3D7hZaRZE4QNP2ERKbKPNKyTgIpAlZJdluRS8CnyEQO5pgP_JncmDo-i84UtKyWVypMtAfTjB1-qvyGeJ85KQVYk3QCYFixra0zwLuLfIRyAObLARlQk456DbOIj69cC_QfLPGBvJMXMRbdHjGQ"/>
    </div>
    <div class="absolute bottom-[15%] right-[10%] opacity-10 -rotate-45">
      <img alt="System Element" class="w-48 h-48 blur-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3ftmozTGugPBPRLb7NQIH_raX4HhFslZpMKbvev9OQJ85Je-Jnsj7rV6BQz2uQmVLUpw_cpzx37p0Vww1eR_fs7zR98fc8tHq0X3yHy4UIGKynpa41JppysGDFmKpptZNxlE4iOr3fGXuHNJJxjrO5w-9Fh9z8i4hUck7sRxgQzlsgMhUW64mhd34wv96ipRuDuCtWN8P6VogcTrJb2z2tRLVcHSW82bCsjnucABdBvDuke7CONOt9Nc_H6Lydi1zFO9AOFtxlA"/>
    </div>
  </div>

  <script type="module">
    import { isAuthenticated } from './src/auth.js';

    // If not authenticated, still show the page but maybe change message (for demo)
    if (!isAuthenticated()) {
      document.getElementById('auth-method').textContent = 'guest';
    }

    let timeLeft = 5;
    const countdownEl = document.getElementById('countdown');
    
    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = `${timeLeft}s`;
      
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
